name: release

# Triggered by a tag shaped `<package-name>@<version>`, e.g. `rustify-ts@2.0.0`.
# The tag is the source of truth: the job resolves it to a directory under
# packages/, refuses to run if that package.json disagrees about the version,
# runs the same gates as CI, and only then publishes.
on:
  push:
    tags:
      - '*@*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm provenance
    steps:
      - uses: actions/checkout@v4

      # Resolves the tag to a package directory and fails loudly on the two
      # mistakes a manual publish makes silently: a tag that names no package,
      # and a tag whose version drifted from the manifest.
      - id: pkg
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs")
            const tag = process.env.TAG
            const at = tag.lastIndexOf("@")
            if (at < 1) throw new Error(`tag "${tag}" is not <package-name>@<version>`)
            const name = tag.slice(0, at)
            const version = tag.slice(at + 1)

            const dir = fs.readdirSync("packages").find((d) => {
              try {
                return JSON.parse(fs.readFileSync(`packages/${d}/package.json`, "utf8")).name === name
              } catch {
                return false
              }
            })
            if (!dir) throw new Error(`no package named "${name}" under packages/`)

            const pkg = JSON.parse(fs.readFileSync(`packages/${dir}/package.json`, "utf8"))
            if (pkg.version !== version) {
              throw new Error(`tag says ${version}, packages/${dir}/package.json says ${pkg.version}`)
            }
            if (pkg.private) throw new Error(`packages/${dir} is private`)

            fs.appendFileSync(process.env.GITHUB_OUTPUT, `dir=packages/${dir}\nname=${name}\nversion=${version}\n`)
            console.log(`publishing ${name}@${version} from packages/${dir}`)
          '

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      # tsdown requires Node ^22.18.0 || >=24.11.0, so the release build cannot
      # run on the Node 20 that CI's check job still covers.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # A version can never be reused on npm, so a duplicate is worth catching
      # before the gates burn five minutes to fail on a 403.
      - name: Refuse to republish
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version >/dev/null 2>&1; then
            echo "::error::${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} is already on npm"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm --filter rustify-ts size

      # Built fresh above, so the tarball can't carry a stale dist.
      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
